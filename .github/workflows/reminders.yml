name: Send schedule reminders

# Vercel's Hobby plan only runs cron jobs once a day, which is too coarse for
# "remind me an hour before I post". This pings the same endpoint every 15
# minutes instead. The endpoint is idempotent, so extra runs are harmless.
#
# Set the repository variable APP_URL to your deployment's URL (Settings →
# Secrets and variables → Actions → Variables). Optionally set the CRON_SECRET
# secret to match the environment variable of the same name on Vercel.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder run
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            ${CRON_SECRET:+--header "Authorization: Bearer $CRON_SECRET"} \
            "${APP_URL%/}/api/cron/reminders"
